<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>PS5 Relapse</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0d0f17;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    p {
      color: #8b949e;
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    .btn {
      background: #0070d1;
      color: #ffffff;
      border: none;
      padding: 14px 36px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      outline: none;
    }
    .btn:hover {
      background: #005bb5;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:disabled {
      background: #343942;
      color: #8b949e;
      cursor: not-allowed;
      transform: none;
    }
    #console {
      margin-top: 24px;
      background: #090d13;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.85rem;
      color: #58a6ff;
      text-align: left;
      height: 140px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #console:empty {
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>PS5 Relapse</h1>
    <p>Presiona el botón para iniciar el exploit</p>
    <button id="start-btn" class="btn">Iniciar</button>
    <div id="console"></div>
  </div>

  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module">
    const btn = document.getElementById('start-btn');
    btn.addEventListener('click', async () => {
      if (btn.innerText === 'Reintentar') {
        window.location.reload();
        return;
      }
      btn.disabled = true;
      btn.innerText = 'Ejecutando...';
      try {
        await import('./src/site.js');
      } catch (err) {
        btn.disabled = false;
        btn.innerText = 'Reintentar';
        const output = document.getElementById('console');
        if (output) {
          const div = document.createElement('div');
          div.textContent = `[-] ${err && err.message ? err.message : err}`;
          output.appendChild(div);
        }
      }
    });
  </script>
</body>
</html>
