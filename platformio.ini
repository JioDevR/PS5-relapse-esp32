; PlatformIO Project Configuration File
; ESP32-S3 N8R2 (8MB Flash / 2MB PSRAM)
;
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
data_dir = data
default_envs = esp32s3_n8r2

[env:esp32s3_n8r2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Velocidad del monitor serial y puertos
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

; Configuración de memoria Flash y PSRAM Quad-SPI (N8R2)
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi

; Tabla de particiones personalizada (8MB Flash: 2.5MB App / 5.43MB LittleFS)
board_build.partitions = partitions_8MB.csv

; Sistema de archivos LittleFS
board_build.filesystem = littlefs

; Flags de compilación: Habilitar PSRAM y salida serie UART
build_flags = 
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=0

; Script para sincronizar y optimizar automáticamente 'server/' hacia 'data/'
extra_scripts = pre:scripts/prepare_data.py
